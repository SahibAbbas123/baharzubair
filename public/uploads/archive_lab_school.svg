<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="700" cy="80" r="140" fill="rgba(255,255,255,0.04)"/>
  <circle cx="100" cy="420" r="180" fill="rgba(255,255,255,0.03)"/>
  
  <!-- Architectural badge -->
  <g transform="translate(60, 60)">
    <rect width="140" height="32" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="70" y="21" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">GOVERNANCE</text>
  </g>

  <!-- Graphic emblem -->
  <g transform="translate(660, 80)" stroke="rgba(255,255,255,0.25)" fill="none" stroke-width="2">
    <circle cx="0" cy="0" r="45"/>
    <circle cx="0" cy="0" r="30"/>
    <line x1="-20" y1="0" x2="20" y2="0"/>
    <line x1="0" y1="-20" x2="0" y2="20"/>
  </g>
  
  <!-- Typography -->
  <g transform="translate(60, 260)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Georgia, serif" font-size="34" font-weight="bold">Ctg Laboratory School & College</text>
    <text x="0" y="45" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Governing Council Strategic Session</text>
  </g>
  
  <!-- Bottom bar -->
  <line x1="60" y1="420" x2="740" y2="420" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="60" y="445" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="12">ARCHIVAL RECORD • DEPT OF ACCOUNTING • CHATTOGRAM</text>
</svg>